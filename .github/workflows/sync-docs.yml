# .github/workflows/sync-docs.yml — install this in a PROJECT's own GitHub repo (not here).
# Fires on every push that touches docs/**/*.md, README.md, or CHANGELOG.md, and pushes exactly
# those (scoped, nothing else) into the knowledge base at ajish-ideaslab/knowledge, under
# projects/<SLUG>/docs/. Genuinely event-driven — the knowledge base updates the moment you push,
# not on a daily delay.
#
# Setup (once per repo):
#   1. Edit SLUG below to this project's slug in the knowledge base (matches projects/<slug>/).
#   2. Add a repo secret KNOWLEDGE_SYNC_TOKEN — a fine-grained GitHub PAT scoped to ONLY
#      ajish-ideaslab/knowledge, Contents: Read and write. Do not reuse a broader token.
#   3. Commit this file as .github/workflows/sync-docs.yml in this project's repo.

name: Sync docs to knowledge base

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'CHANGELOG.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SLUG: action-analyzer   # <-- EDIT: this project's slug under projects/ in the knowledge base
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout knowledge base
        uses: actions/checkout@v4
        with:
          repository: ajish-ideaslab/knowledge
          token: ${{ secrets.KNOWLEDGE_SYNC_TOKEN }}
          path: knowledge

      - name: Sync the fixed scope (docs/*.md, README.md, CHANGELOG.md — nothing else)
        run: |
          set -euo pipefail
          DEST="knowledge/projects/${SLUG}/docs"
          mkdir -p "$DEST"
          if [ -d docs ]; then
            find docs -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
              rel="${f#docs/}"
              mkdir -p "$DEST/$(dirname "$rel")"
              cp "$f" "$DEST/$rel"
            done
          fi
          [ -f README.md ] && cp README.md "$DEST/README.md"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$DEST/CHANGELOG.md"

      - name: Commit and push if anything changed
        run: |
          cd knowledge
          git config user.name "docs-sync-bot"
          git config user.email "docs-sync@users.noreply.github.com"
          git add "projects/${SLUG}/docs"
          if git diff --cached --quiet; then
            echo "No doc changes to sync."
          else
            git commit -m "docs: sync ${SLUG} from ${{ github.repository }}@${{ github.sha }}"
            git push
          fi
